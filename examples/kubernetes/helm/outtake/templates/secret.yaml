{{- $storage := include "outtake.storageBackend" . }}
{{- $database := include "outtake.databaseBackend" . }}
{{- $needS3 := and (eq $storage "s3") (not .Values.outtake.s3.existingSecret) }}
{{- $dbUrl := include "outtake.databaseUrl" . }}
{{- $needDb := and (eq $database "postgres") (not .Values.outtake.existingSecret) $dbUrl }}
{{- if or $needS3 $needDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "outtake.fullname" . }}
  labels:
    {{- include "outtake.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needS3 }}
  {{ .Values.outtake.s3.accessKeyKey }}: {{ .Values.outtake.s3.accessKey | quote }}
  {{ .Values.outtake.s3.secretKeyKey }}: {{ .Values.outtake.s3.secretKey | quote }}
  {{- end }}
  {{- if $needDb }}
  {{ .Values.outtake.databaseUrlKey }}: {{ $dbUrl | quote }}
  {{- end }}
{{- end }}
