apiVersion: v1
kind: Service
metadata:
  name: {{ include "outtake.fullname" . }}
  labels:
    {{- include "outtake.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ include "outtake.httpPort" . }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "outtake.selectorLabels" . | nindent 4 }}
