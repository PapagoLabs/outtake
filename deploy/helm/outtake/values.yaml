# Default values keep Outtake on local FS + SQLite (same as docker-compose.yml).
# For k8s, set media.nfs and switch storage/database backends (see examples/).

replicaCount: 1

image:
  repository: ghcr.io/papagolabs/outtake
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

# Required site input for k8s: NFS (or set media.existingClaim) with Plex media.
# Clips and metadata do not live here.
media:
  mountPath: /media
  plexMediaRoot: ""
  localMediaRoot: /media
  nfs:
    server: ""
    path: ""
    readOnly: true
  existingClaim: ""

# Scratch / sqlite / filesystem blobs — never the media NFS.
data:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

outtake:
  listenAddr: "0.0.0.0:8080"
  publicBaseUrl: ""
  logLevel: info
  env: production
  # filesystem | s3 (generic: SeaweedFS, RustFS, or any S3-compatible)
  storageBackend: filesystem
  storagePath: /data/output
  s3:
    endpoint: ""
    bucket: ""
    region: us-east-1
    accessKey: ""
    secretKey: ""
    usePathStyle: true
    existingSecret: ""
    accessKeyKey: s3-access-key
    secretKeyKey: s3-secret-key
  # sqlite | postgres (pgx: CockroachDB or CNPG/Postgres)
  databaseBackend: sqlite
  databasePath: /data/outtake.db
  databaseUrl: ""
  existingSecret: ""
  databaseUrlKey: database-url

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
