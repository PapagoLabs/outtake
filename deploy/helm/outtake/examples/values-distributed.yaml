# One working k8s combo: generic S3 (SeaweedFS or RustFS) + pgx (Cockroach or CNPG).
# NFS is the required site input for Plex source media. Clips stay on S3.

outtake:
  storageBackend: s3
  storagePath: /data/scratch
  s3:
    endpoint: http://seaweedfs-s3:8333
    bucket: outtake
    region: us-east-1
    usePathStyle: true
    # accessKey / secretKey or existingSecret
  databaseBackend: postgres
  # databaseUrl: postgres://user:pass@cockroachdb-public:26257/outtake?sslmode=require
  # or CNPG: postgres://user:pass@outtake-pg-rw:5432/outtake

media:
  nfs:
    server: nfs.example.internal
    path: /export/plex
    readOnly: true
  plexMediaRoot: /volume1/Media
  localMediaRoot: /media
