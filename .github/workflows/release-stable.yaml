name: Release Stable

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in test mode without publishing artifacts"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read

  build:
    needs: [test]
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    with:
      build-type: stable
      dry-run: ${{ inputs.dry-run || false }}
