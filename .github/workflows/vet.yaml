name: vet

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - main.go
      - go.mod
      - go.sum
      - internal/**
      - testing/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Vet the output of templ generate alone, without the goimports pass, so a
      # template that imports a package it never uses fails here as it would
      # fail the image build.
      - name: Generate templ
        run: go tool templ generate

      - name: Vet
        run: go vet ./...

      - name: Vet the e2e suite
        run: go vet -tags e2e ./testing/e2e/...
