# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    - task: lint
    - task: vet

  build:
    desc: Build the outtake binary
    cmds:
      - go build -o ./bin/outtake .

  test:
    desc: Run tests under the race detector and gate the hand-written code's coverage
    cmds:
      - go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - build/ci/coverage-gate.sh coverage.out

  test-e2e:
    desc: Run e2e tests (requires FFmpeg and Plex credentials)
    cmds:
      - go test -v -count=1 -tags e2e ./testing/e2e/...

  test-e2e-parallel:
    desc: Run e2e tests in parallel (requires FFmpeg and Plex credentials)
    cmds:
      - go test -v -count=1 -p 4 -parallel 8 -tags e2e ./testing/e2e/...

  mock:
    desc: Generate test mocks using mockery, with imports grouped like the rest of the code
    cmds:
      - go tool mockery --config=build/mockery/mockery.yaml
      - find internal -type d -name mocks -exec go tool goimports -local github.com/PapagoLabs/outtake -w {} +

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --fix --config build/golangci-lint/golangci-lint.yaml ./...

  lint-ci:
    desc: Run golangci-lint in CI mode (no fix)
    cmds:
      - golangci-lint run --config build/golangci-lint/golangci-lint.yaml ./...

  vet:
    desc: Run go vet, including the e2e suite
    cmds:
      - go vet ./...
      - go vet -tags e2e ./testing/e2e/...

  fmt:
    desc: Format code
    cmds:
      - golangci-lint fmt --config build/golangci-lint/golangci-lint.yaml ./...

  run:
    desc: Run outtake
    cmds:
      - go run . server start

  compose-dev:
    desc: Run outtake via docker compose
    cmds:
      - docker compose up --build

  goreleaser:
    desc: Validate and snapshot-build with GoReleaser
    deps: [templ]
    cmds:
      - goreleaser build --config build/goreleaser/stable.yaml --snapshot --clean

  goreleaser:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check --config build/goreleaser/stable.yaml
      - goreleaser check --config build/goreleaser/nightly.yaml

  goreleaser:release:
    desc: Create a stable release with GoReleaser
    deps: [templ]
    cmds:
      - goreleaser release --config build/goreleaser/stable.yaml

  goreleaser:nightly:
    desc: Snapshot a nightly image build with GoReleaser
    deps: [templ]
    cmds:
      - goreleaser release --config build/goreleaser/nightly.yaml --snapshot --clean --skip=validate,archive

  install:
    desc: Install outtake
    cmds:
      - go install .

  mod-tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  mod-download:
    desc: Download Go modules
    cmds:
      - go mod download

  mod-verify:
    desc: Verify Go modules
    cmds:
      - go mod verify

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ docs/public docs/resources/_gen

  docs:
    desc: Regenerate the CLI reference under docs/content/cli-reference
    cmds:
      - rm -rf docs/content/cli-reference
      - go run ./tools/docgen -out ./docs/content/cli-reference

  docs:build:
    desc: Build the documentation site into docs/public
    cmds:
      - hugo --source docs --gc --minify

  docs:serve:
    desc: Preview the documentation site with live reload
    cmds:
      - hugo server --source docs

  templ:
    desc: Run templ
    cmds:
      - go tool templ generate
      - go tool goimports -local github.com/PapagoLabs/outtake -w ./internal/web

  templ-watch:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:8080" --cmd="go run . server start" --open-browser=false

  theme-css:
    desc: Generate palette CSS from the theme catalog
    cmds:
      - go run ./internal/web/theme/gen.go

  tailwind:
    desc: Watch Tailwind CSS changes
    deps: [theme-css]
    cmds:
      - "tailwindcss -i ./internal/web/assets/css/input.css -o ./internal/web/assets/css/output.css"

  tailwind-watch:
    desc: Watch Tailwind CSS changes
    cmds:
      - "tailwindcss -i ./internal/web/assets/css/input.css -o ./internal/web/assets/css/output.css --watch"
