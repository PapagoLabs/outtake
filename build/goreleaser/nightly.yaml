################################################################################
#                                                                              #
#                 GoReleaser OSS Nightly Release Configuration                 #
#                                                                              #
# Project: outtake                                                             #
# Repository: https://github.com/PapagoLabs/outtake/                           #
#                                                                              #
# GoReleaser URL: https://goreleaser.com/                                      #
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json      #
# vim: set ts=2 sw=2 tw=0 fo=cnqoj                                             #
#                                                                              #
################################################################################

################################################################################
# Configuration Version
version: 2
################################################################################

################################################################################
# Project Configuration
# https://goreleaser.com/customization/project/
################################################################################
project_name: "outtake"

################################################################################
# Verifiable Builds (Supply Chain Security)
# https://goreleaser.com/customization/builds/verifiable_builds/
################################################################################
# Skip verifiable builds for nightly image builds.

################################################################################
# Go Binary Build Configuration
# https://goreleaser.com/customization/builds/go/
################################################################################
builds:
  - id: "outtake-binary"
    main: "main.go"
    binary: "outtake"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/PapagoLabs/outtake/internal/cli/metadata.Version={{ .Version }}
      - -X github.com/PapagoLabs/outtake/internal/cli/metadata.CommitSHA={{ .Commit }}
      - -X github.com/PapagoLabs/outtake/internal/cli/metadata.BuildTime={{ .CommitDate }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

################################################################################
# Release Configuration (SCM)
# https://goreleaser.com/customization/publish/scm/
################################################################################
# Skip release to GitHub for nightly releases
release:
  disable: true

################################################################################
# Binary Archive Configuration
# https://goreleaser.com/customization/package/archives/
################################################################################
# Skip building archives for nightly releases

################################################################################
# Source Archive Configuration
################################################################################
# Skip archive handling for nightly releases

################################################################################
# Checksums Configuration
# https://goreleaser.com/customization/package/checksum/
################################################################################
# Skip checksum handling for nightly releases

################################################################################
# Docker Digests Configuration
# https://goreleaser.com/customization/package/docker_digests/
################################################################################
docker_digest:
  name_template: "digests.txt"

################################################################################
# Docker Image Build Configuration
# https://goreleaser.com/customization/package/dockers_v2/
################################################################################
dockers_v2:
  ##############################################################################
  # Multi-platform manifest (all platforms) - non-prefixed nightly tag only
  ##############################################################################
  - id: "outtake-manifest-nightly"
    ids: ["outtake-binary"]
    images:
      - "papagolabs/outtake"
      - "ghcr.io/papagolabs/outtake"
    tags:
      - "nightly"
    dockerfile: build/docker/Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    hooks:
      pre:
        - cmd: go run .
          dir: scripts/download-ffmpeg
          env:
            - FFMPEG_ARCH=amd64
            - FFMPEG_DEST={{ .ContextDir }}/linux/amd64
          output: true
        - cmd: go run .
          dir: scripts/download-ffmpeg
          env:
            - FFMPEG_ARCH=arm64
            - FFMPEG_DEST={{ .ContextDir }}/linux/arm64
          output: true
    labels:
      org.opencontainers.image.name: "outtake"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.description: "A clip manager for Plex libraries."
      org.opencontainers.image.licenses: "AGPL-3.0-or-later"
      org.opencontainers.image.url: "https://github.com/PapagoLabs/outtake"

  ##############################################################################
  # Platform-specific images - platform-prefixed nightly tags only
  ##############################################################################
  - id: "outtake-amd64-nightly"
    ids: ["outtake-binary"]
    images:
      - "papagolabs/outtake"
      - "ghcr.io/papagolabs/outtake"
    tags:
      - "amd64-nightly"
    dockerfile: build/docker/Dockerfile
    platforms:
      - linux/amd64
    hooks:
      pre:
        - cmd: go run .
          dir: scripts/download-ffmpeg
          env:
            - FFMPEG_ARCH=amd64
            - FFMPEG_DEST={{ .ContextDir }}/linux/amd64
          output: true
    labels:
      org.opencontainers.image.name: "outtake"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.description: "A clip manager for Plex libraries."
      org.opencontainers.image.licenses: "AGPL-3.0-or-later"
      org.opencontainers.image.url: "https://github.com/PapagoLabs/outtake"

  - id: "outtake-arm64v8-nightly"
    ids: ["outtake-binary"]
    images:
      - "papagolabs/outtake"
      - "ghcr.io/papagolabs/outtake"
    tags:
      - "arm64v8-nightly"
    dockerfile: build/docker/Dockerfile
    platforms:
      - linux/arm64
    hooks:
      pre:
        - cmd: go run .
          dir: scripts/download-ffmpeg
          env:
            - FFMPEG_ARCH=arm64
            - FFMPEG_DEST={{ .ContextDir }}/linux/arm64
          output: true
    labels:
      org.opencontainers.image.name: "outtake"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.description: "A clip manager for Plex libraries."
      org.opencontainers.image.licenses: "AGPL-3.0-or-later"
      org.opencontainers.image.url: "https://github.com/PapagoLabs/outtake"

################################################################################
# Software Bill of Materials (SBOM) Configuration
# https://goreleaser.com/customization/sbom/
################################################################################
# Skip SBOM for nightlies

################################################################################
# Docker Image Signing (Cosign)
# https://goreleaser.com/customization/sign/docker_sign/
################################################################################
docker_signs:
  - id: cosign-images
    cmd: cosign
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
    output: true

################################################################################
# Changelog Configuration
# https://goreleaser.com/customization/changelog/
################################################################################
changelog:
  disable: true
